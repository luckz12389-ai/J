<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lunex Wiki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><canvas id="stars"></canvas>
<header>
  <div class="logo">🌙 Lunex <b>Wiki</b></div>
  <nav id="nav"></nav>
  <button id="adminBtn" class="btn ghost">Admin</button>
</header>
<main id="view"></main>
<dialog id="login">
  <form id="loginForm">
    <h3>Verificação de Admin</h3>
    <input name="user" placeholder="Usuário" required autocomplete="username">
    <input name="pass" type="password" placeholder="Senha" required autocomplete="current-password">
    <p id="loginErr" class="err"></p>
    <div class="row"><button type="button" class="btn ghost" id="loginCancel">Cancelar</button><button class="btn">Entrar</button></div>
  </form>
</dialog>
<div id="cookie" hidden>
  <p>🍪 Usamos cookies para lembrar sua última aba. Aceitar?</p>
  <button class="btn" id="cAccept">Aceitar</button><button class="btn ghost" id="cDeny">Recusar</button>
</div>
<script src="app.js"></script>
</body>
</html>
